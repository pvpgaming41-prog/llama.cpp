name: Build AURA Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Android NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653"

      - name: Configure Android ARM64 CPU build
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_HOME}/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_OPENCL=OFF \
            -DGGML_CUDA=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF

      - name: Build
        run: |
          cmake --build build-android --config Release -j2

      - name: Find native libraries
        run: |
          find build-android -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print

      - name: Package
        run: |
          mkdir -p artifact
          find build-android -type f -name "*.so" -exec cp {} artifact/ \;
          ls -lh artifact

      - name: Upload ARM64 libraries
        uses: actions/upload-arti
