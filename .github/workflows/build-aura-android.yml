name: AURA Android ARM64 llama.cpp

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 libllama
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout AURA
        uses: actions/checkout@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "platforms;android-29" "build-tools;29.0.3" "ndk;25.2.9519653"

      - name: Set NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_PATH"

      - name: Install CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Check toolchain
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/ndk-build" --version
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          cmake --version

      - name: Build llama.cpp
        working-directory: app/src/main/cpp/llama.cpp
        run: |
          cmake -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_STL=c++_shared \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
  
